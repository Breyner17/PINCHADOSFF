<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pinchados | Recuperar Contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FUENTE -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <style>

    :root {
      --rojo: #e10600;
      --amarillo: #ffcc00;
      --negro: #0f0f0f;
      --gris: #1b1b1b;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins', sans-serif;
      background:var(--gris);
      color:white;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* ===== HEADER ===== */

    header{
      background:
        linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
        url("bg_banner.png") center/cover no-repeat;
    }

    .nav{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px 30px;
    }

    .logo img{
      width:150px;
      transition:.3s;
    }

    .logo img:hover{
      transform:scale(1.1);
    }

    .btn-login{
      background:var(--rojo);
      border:none;
      padding:10px 18px;
      border-radius:8px;
      color:white;
      font-weight:700;
      cursor:pointer;
      transition:.3s;
    }

    .btn-login:hover{
      background:var(--amarillo);
      color:black;
      transform:scale(1.1);
    }

    /* ===== RECUPERAR ===== */

    .recuperar-container{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:40px 20px;
    }

    .recuperar-box{
      background:var(--negro);
      width:100%;
      max-width:420px;
      padding:40px 30px;
      border-radius:20px;
      box-shadow:0 20px 50px rgba(0,0,0,.7);
      animation:entrada .6s ease;
      text-align:center;
    }

    @keyframes entrada{
      from{
        opacity:0;
        transform:translateY(40px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .recuperar-box h2{
      color:var(--amarillo);
      font-size:1.9rem;
      margin-bottom:15px;
      font-weight:800;
    }

    .recuperar-box p{
      font-size:.9rem;
      color:#ccc;
      margin-bottom:25px;
      line-height:1.5;
    }

    .campo{
      margin-bottom:20px;
      text-align:left;
    }

    .campo label{
      font-size:.85rem;
      color:#ccc;
      display:block;
      margin-bottom:5px;
    }

    .campo input{
      width:100%;
      padding:12px 14px;
      border-radius:8px;
      border:none;
      outline:none;
      background:#262626;
      color:white;
      font-size:.95rem;
      transition:.3s;
    }

    .campo input:focus{
      background:#2f2f2f;
      box-shadow:0 0 0 2px var(--amarillo);
    }

    /* ===== BOTON ===== */

    .btn-recuperar{
      width:100%;
      padding:14px;
      border:none;
      border-radius:10px;
      background:var(--rojo);
      color:white;
      font-weight:800;
      font-size:1rem;
      cursor:pointer;
      transition:.3s;
      margin-top:10px;
    }

    .btn-recuperar:hover{
      background:var(--amarillo);
      color:black;
      transform:scale(1.05);
    }

    /* ===== LINKS ===== */

    .links{
      margin-top:20px;
      font-size:.9rem;
    }

    .links a{
      color:var(--amarillo);
      text-decoration:none;
      font-weight:600;
    }

    .links a:hover{
      text-decoration:underline;
    }

    /* ===== FOOTER ===== */

    footer{
      background:var(--negro);
      border-top:3px solid var(--rojo);
      padding:15px;
      text-align:center;
      font-size:.8rem;
      color:#ccc;
    }

    footer span{
      color:var(--amarillo);
      font-weight:bold;
    }

  </style>
</head>

<body>

<!-- ===== HEADER ===== -->

<header>
  <nav class="nav">

    <div class="logo">
      <a href="index.html">
        <img src="logo_pinchados.png" alt="Pinchados">
      </a>
    </div>

    <div>
      <a href="login.html">
        <button class="btn-login">VOLVER</button>
      </a>
    </div>

  </nav>
</header>


<!-- ===== RECUPERAR ===== -->

<section class="recuperar-container">

  <div class="recuperar-box">

    <h2>Recuperar Contraseña</h2>

    <p>
      Ingresa tu correo electrónico y te enviaremos
      un enlace para restablecer tu contraseña.
    </p>

    <form action="#" method="POST">

      <div class="campo">
        <label>Correo electrónico</label>
        <input type="email" placeholder="correo@email.com" required>
      </div>

      <button class="btn-recuperar">
        ENVIAR ENLACE
      </button>

    </form>

    <div class="links">
      <br>
      <a href="login.html">← Volver a Iniciar Sesión</a>
    </div>

  </div>

</section>


<!-- ===== FOOTER ===== -->

<footer>
  © 2026 <span>Pinchados</span> · Todos los derechos reservados
</footer>


</body>
</html>
