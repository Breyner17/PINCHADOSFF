<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin | Pinchados</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>

:root{
--rojo:#e10600;
--amarillo:#ffcc00;
--negro:#121212;
--gris:#1e1e1e;
--verde:#00cc44;
--blanco:#f5f5f5;
}

*{box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:var(--gris);
color:var(--blanco);
margin:0;
}

/* HEADER */

header{
background:var(--rojo);
padding:18px;
text-align:center;
font-size:24px;
font-weight:800;
letter-spacing:1px;
}

/* CONTENEDOR */

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

/* TOPBAR */

.topbar{
display:flex;
gap:12px;
flex-wrap:wrap;
align-items:center;
margin-bottom:25px;
}

.topbar button,
.topbar input{
padding:10px 16px;
border:none;
border-radius:8px;
font-weight:700;
font-size:14px;
}

/* BOTONES */

.refresh{
background:var(--amarillo);
color:black;
cursor:pointer;
}

.export{
background:#3498db;
color:white;
cursor:pointer;
}

input[type="date"]{
background:#222;
color:white;
border:1px solid #555;
}

/* TITULOS */

h2{
color:var(--amarillo);
margin:25px 0 15px;
}

/* CARDS */

.pedido{
background:var(--negro);
border-radius:14px;
padding:18px;
margin-bottom:20px;
border:2px solid #333;
box-shadow:0 0 10px rgba(0,0,0,.4);
}

.pedido.confirmado{
border-color:var(--verde);
}

/* HEADER CARD */

.pedido-header{
display:grid;
grid-template-columns:1fr 1fr auto;
gap:12px;
align-items:center;
font-size:14px;
}

.pedido-header div{
line-height:1.4;
}

/* BADGES */

.badge{
padding:4px 12px;
border-radius:20px;
font-size:12px;
font-weight:700;
display:inline-block;
margin-bottom:4px;
}

.pendiente{
background:#f39c12;
color:black;
}

.ok{
background:var(--verde);
color:black;
}

/* INFO PEDIDO */

.info{
margin:15px 0;
background:#2b2b2b; /* MAS CLARO */
padding:14px;
border-radius:8px;
font-size:14px;
white-space:pre-wrap;
color:#ffffff; /* TEXTO BLANCO */
border-left:4px solid var(--amarillo);
}

/* BOTONES */

.botones{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:10px;
}

.botones button{
padding:8px 14px;
border:none;
border-radius:6px;
font-weight:700;
cursor:pointer;
}

.confirmar{
background:var(--verde);
color:black;
}

.eliminar{
background:#b00020;
color:white;
}

/* TOTALES */

.totalBox{
background:#111;
border:2px solid var(--amarillo);
padding:18px;
border-radius:12px;
margin-top:30px;
font-size:18px;
text-align:center;
line-height:1.6;
}

/* RESPONSIVE */

@media(max-width:700px){

.pedido-header{
grid-template-columns:1fr;
text-align:left;
}

}

/* NOMBRE CLIENTE */

.cliente-nombre{
font-size:22px;
font-weight:800;
color:var(--negro);
margin-bottom:4px;
}

.ubicacion{
font-size:15px;
color:var(--negro);
font-weight:600;
}


</style>
</head>

<body>

<header>
📊 PANEL ADMIN - PINCHADOS
</header>

<div class="container">

<div class="topbar">

<button class="refresh" onclick="cargarPedidos()">
🔄 Actualizar
</button>

<button class="export" onclick="exportarExcel()">
📤 Exportar Excel
</button>

<input type="date" id="filtroFecha" onchange="filtrarFecha()">

</div>

<h2>🕐 Pedidos Pendientes</h2>
<div id="pendientes"></div>

<h2>✅ Pedidos Confirmados</h2>
<div id="confirmados"></div>

<div class="totalBox" id="totales"></div>

</div>

<script>

/* VARIABLES */

let pedidos = [];
let fechaSeleccionada = "";

/* INICIO */

cargarPedidos();

/* CARGAR */

function cargarPedidos(){

pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];

mostrar();

}

/* MOSTRAR */

function mostrar(){

let pendientesHTML="";
let confirmadosHTML="";
let totalDia=0;
let contador=0;

/* ORDENAR: ULTIMO ARRIBA */
let pedidosOrdenados = [...pedidos].reverse();

pedidosOrdenados.forEach(p=>{

/* FILTRO FECHA */
if(fechaSeleccionada){

let fecha = new Date(p.fecha).toISOString().slice(0,10);

if(fecha !== fechaSeleccionada) return;
}

contador++;

/* BADGE */

let badge = p.estado=="confirmado"
? `<span class="badge ok">Confirmado</span>`
: `<span class="badge pendiente">Pendiente</span>`;


/* UBICACION */

let ubicacion = "";

if(p.tipo=="mesa"){
ubicacion = `${p.mesa || "?"}`;
}else{
ubicacion = `DOMICILIO DIRECCIÓN: ${p.direccion || "Sin dirección"}`;
}


/* CARD */

let card = `

<div class="pedido ${p.estado}">

<!-- HEADER -->

<div class="pedido-header">

<div>

<div class="cliente-nombre">
👤 ${p.nombre || "Cliente"}
</div>

<div class="ubicacion">
${ubicacion}
</div>

<b>🆔 #${p.id}</b><br>
📅 ${p.fecha}

</div>

<div>
${badge}<br>
💳 ${p.pago}<br>
📱 ${p.telefono || "N/A"}
</div>

<div>
💰 <b>$${p.total}</b>
</div>

</div>

<!-- DETALLE -->

<div class="info">
${p.detalle}
</div>

<!-- BOTONES -->

<div class="botones">

${
p.estado=="pendiente"
? `<button class="confirmar" onclick="confirmar(${p.id})">
✅ Confirmar
</button>`
: ""
}

<button class="eliminar" onclick="eliminar(${p.id})">
🗑 Eliminar
</button>

</div>

</div>

`;

/* CLASIFICAR */

if(p.estado=="pendiente"){
pendientesHTML+=card;
}else{
confirmadosHTML+=card;
totalDia+=p.total;
}

});

/* MOSTRAR */

pendientes.innerHTML = pendientesHTML || "📭 No hay pedidos pendientes";
confirmados.innerHTML = confirmadosHTML || "📭 No hay pedidos confirmados";

totales.innerHTML = `
📈 Total del día: <b>$${totalDia}</b><br>
📦 Pedidos: <b>${contador}</b>
`;

}

/* CONFIRMAR */

function confirmar(id){

if(!confirm("¿Confirmar este pedido?")) return;

let pedido = null;

pedidos = pedidos.map(p=>{

if(p.id==id){
p.estado="confirmado";
pedido = p;
}

return p;

});

guardar();
mostrar();

if(pedido){
enviarConfirmacion(pedido);
}

}

/* ELIMINAR */

function eliminar(id){

if(!confirm("¿Eliminar definitivamente este pedido?")) return;

pedidos = pedidos.filter(p=>p.id!=id);

guardar();
mostrar();

}

/* GUARDAR */

function guardar(){

localStorage.setItem("pedidos",JSON.stringify(pedidos));

}

/* EXPORTAR */

function exportarExcel(){

let data = pedidos.filter(p=>p.estado=="confirmado");

if(data.length==0){
alert("No hay pedidos confirmados");
return;
}

let csv = "ID,Fecha,Tipo,Pago,Total,Detalle\n";

data.forEach(p=>{

let d = p.detalle.replace(/\n/g," | ");

csv+=`${p.id},${p.fecha},${p.tipo},${p.pago},${p.total},"${d}"\n`;

});

let blob = new Blob([csv],{type:"text/csv"});

let url = URL.createObjectURL(blob);

let a = document.createElement("a");

a.href=url;
a.download="pedidos_confirmados.csv";

a.click();

URL.revokeObjectURL(url);

}

/* FILTRAR */

function filtrarFecha(){

fechaSeleccionada = document.getElementById("filtroFecha").value;

mostrar();

}

/* WHATSAPP */

function enviarConfirmacion(p){

if(!p.telefono) return;

/* UBICACION */

let ubicacion = "";

if(p.tipo === "mesa"){
ubicacion = "🍽 Mesa: " + p.mesa;
}else{
ubicacion = "🏠 Dirección: " + p.direccion;
}

/* MENSAJE */

let mensaje = 
` *PEDIDO CONFIRMADO*


📋 Pedido:
${p.detalle}

----------------
🆔 #${p.id}
💳 Pago: ${p.pago}
💰 Total: $${p.total}

Gracias por tu compra 🙌🔥
Pinchados`;

/* ENVIAR */

let url =
"https://wa.me/57"+p.telefono+
"?text="+encodeURIComponent(mensaje);

window.open(url,"_blank");

}


</script>

</body>
</html>
