<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pinchados | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FUENTE -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<!-- ===== HEADER ===== -->

<header>
  <nav class="nav">
    <div class="logo">
        <img src="{{ url_for('static', filename='img/logo_pinchados.png') }}" alt="Logo">
      </a>
    </div>

  </nav>
</header>

<!-- ===== LOGIN ===== -->

<section class="login-container">

  <div class="login-box">

    <h2>Panel Administrador</h2>

    <!-- 🔐 Formulario -->
    <form id="loginForm" method="POST" action="{{ url_for('login') }}">

      <div class="campo">
        <label>Usuario</label>
        <input 
       type="text"
       id="email"
      name="username"
       placeholder="Usuario administrador"
       required
      >
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input 
          type="password" 
          id="password"
          name="password"
          placeholder="********" 
          required
        >
      </div>

      <!-- ✅ BOTÓN DEBE IR DENTRO DEL FORM -->
      <button type="submit" class="btn-login">
        INGRESAR
      </button>

      <a href="{{ url_for('select') }}" class="btn-volver">
       VOLVER
      </a>
    </form>

    <p id="mensaje" style="margin-top:10px;text-align:center;">
      {% if error %}{{ error }}{% endif %}
    </p>

  </div>

</section>



<!-- ===== FOOTER ===== -->

<footer>
  © 2026 <span>Pinchados</span> · Todos los derechos reservados
</footer>


</body>
</html>
